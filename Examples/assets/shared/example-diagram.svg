<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title description">
  <title id="title">Najważniejsze grupy funkcyjne chemii organicznej</title>
  <desc id="description">Cztery pola porównują grupę hydroksylową alkoholu, aldehydową aldehydu, karbonylową ketonu i karboksylową kwasu karboksylowego.</desc>
  <rect width="960" height="540" rx="40" fill="#eef8f5"/>
  <text x="480" y="76" fill="#132238" font-family="Arial, sans-serif" font-size="40" font-weight="700" text-anchor="middle">Grupy funkcyjne</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(55 120)">
      <rect width="195" height="310" rx="28" fill="#ffffff" stroke="#7bc7ba" stroke-width="5"/>
      <text x="98" y="62" fill="#0e665a" font-size="27" font-weight="700">ALKOHOL</text>
      <text x="98" y="157" fill="#172033" font-size="48" font-weight="700">–OH</text>
      <text x="98" y="220" fill="#56637a" font-size="24">hydroksylowa</text>
      <text x="98" y="270" fill="#172033" font-size="23">etanol</text>
    </g>
    <g transform="translate(270 120)">
      <rect width="195" height="310" rx="28" fill="#ffffff" stroke="#f0aa48" stroke-width="5"/>
      <text x="98" y="62" fill="#9a5a00" font-size="27" font-weight="700">ALDEHYD</text>
      <text x="98" y="157" fill="#172033" font-size="48" font-weight="700">–CHO</text>
      <text x="98" y="220" fill="#56637a" font-size="24">aldehydowa</text>
      <text x="98" y="270" fill="#172033" font-size="23">etanal</text>
    </g>
    <g transform="translate(485 120)">
      <rect width="195" height="310" rx="28" fill="#ffffff" stroke="#8b7bd8" stroke-width="5"/>
      <text x="98" y="62" fill="#5b46b2" font-size="27" font-weight="700">KETON</text>
      <text x="98" y="157" fill="#172033" font-size="48" font-weight="700">&gt;C=O</text>
      <text x="98" y="220" fill="#56637a" font-size="24">karbonylowa</text>
      <text x="98" y="270" fill="#172033" font-size="23">propanon</text>
    </g>
    <g transform="translate(700 120)">
      <rect width="205" height="310" rx="28" fill="#ffffff" stroke="#dc6b6b" stroke-width="5"/>
      <text x="103" y="62" fill="#a33232" font-size="24" font-weight="700">KWAS</text>
      <text x="103" y="157" fill="#172033" font-size="44" font-weight="700">–COOH</text>
      <text x="103" y="220" fill="#56637a" font-size="23">karboksylowa</text>
      <text x="103" y="270" fill="#172033" font-size="22">kwas etanowy</text>
    </g>
  </g>
  <text x="480" y="492" fill="#184f49" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Budowa grupy funkcyjnej decyduje o właściwościach związku</text>
</svg>
